version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cloud-ide-redis
    ports:
      - "6379:6379"
    networks:
      - cloud-ide-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-ide-backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./frontend:/app/frontend:ro
    environment:
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy
      runner:
        condition: service_completed_successfully
    networks:
      - cloud-ide-network
    restart: unless-stopped

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: python-runner:latest
    container_name: cloud-ide-runner-build
    command: ["python", "--version"]

networks:
  cloud-ide-network:
    driver: bridge